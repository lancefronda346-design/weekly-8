<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanical Engineering Exam (1-60)</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #3b82f6;
            --accent: #f59e0b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --correct: #22c55e;
            --incorrect: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 30px;
            margin: 20px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--primary);
            font-size: 1.6rem;
            margin: 0 0 5px 0;
        }

        .timer-box {
            background-color: #fef3c7;
            border: 2px solid var(--accent);
            color: #92400e;
            font-size: 1.25rem;
            font-weight: 700;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        .quiz-info {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 20px;
        }

        .question-container {
            margin-bottom: 25px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text);
            line-height: 1.5;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.05rem;
        }

        .option-item:hover {
            background: #e2e8f0;
            border-color: var(--secondary);
        }

        .option-item.correct {
            background: #dcfce7;
            border-color: var(--correct);
            color: #166534;
            font-weight: 600;
        }

        .option-item.incorrect {
            background: #fee2e2;
            border-color: var(--incorrect);
            color: #991b1b;
            font-weight: 600;
        }

        .solution-box {
            display: none;
            background: #eff6ff;
            border-left: 4px solid var(--secondary);
            padding: 15px;
            margin-top: 15px;
            border-radius: 4px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .btn-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        .score-card {
            text-align: center;
            display: none;
        }

        .score-card h2 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .score-card p {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Mechanical Engineering Review Exam (1-60)</h1>
    </header>

    <div class="timer-box" id="timer-box">
        Time Remaining: <span id="time-display">03:00:00</span>
    </div>

    <div id="quiz-section">
        <div class="quiz-info">
            <span id="question-counter">Question 1 of 60</span>
            <span id="score-keeper">Score: 0</span>
        </div>

        <div class="question-container">
            <div id="question-text" class="question-text">Loading problem...</div>
            <ul id="options-list" class="options-list"></ul>
            <div id="solution-box" class="solution-box"></div>
        </div>

        <div class="btn-container">
            <span id="feedback-msg" style="font-weight: 600;"></span>
            <button id="next-btn" onclick="nextQuestion()" disabled>Next Question</button>
        </div>
    </div>

    <div id="score-section" class="score-card">
        <h2>Exam Completed! </h2>
        <p id="final-score-text">Your Score: 0 / 60</p>
        <button onclick="restartQuiz()">Restart Exam</button>
    </div>
</div>

<script>
    // Official Answer Key mapping provided:
    // 1-10:  A, C, C, C, A, B, A, B, A, B
    // 11-20: B, C, B, B, C, D, D, C, D, C
    // 21-30: D, A, B, D, C, B, A, A, B, A
    // 31-40: A, C, D, B, C, C, A, A, A, B
    // 41-50: C, B, B, A, D, B, D, C, D, A
    // 51-60: D, C, D, B, C, A, A, D, A, A

    const keys = [
        "A","C","C","C","A","B","A","B","A","B",
        "B","C","B","B","C","D","D","C","D","C",
        "D","A","B","D","C","B","A","A","B","A",
        "A","C","D","B","C","C","A","A","A","B",
        "C","B","B","A","D","B","D","C","D","A",
        "D","C","D","B","C","A","A","D","A","A"
    ];

    const problemTemplates = [
        { q: "A 50-hp pump discharges 400 gpm. The pump head is 375 ft. Find the system efficiency.", opts: ["75.83%", "70.23%", "65.23%", "82.44%"] },
        { q: "A double acting air compressor 250 mm x 450 mm running at 450 rpm has a clearance of 7% and in which it compresses the pressure to 6 times the initial pressure. Find the compressor capacity in ft³/min.", opts: ["432.31", "574.59", "482.34", "456.90"] },
        { q: "A 2 stage air compressor operates between 100 kpa and 900 kpa. Find the intercooler pressure.", opts: ["320 Kpa", "340 Kpa", "300 Kpa", "360 Kpa"] },
        { q: "The fan delivers initially 0.1 m³/s of air when power is 15 kw. If the fan will deliver 0.25 m³/s of air, find the power needed for the fan.", opts: ["27.50 kw", "47.50 kw", "37.50 kw", "57.50 kw"] },
        { q: "A fan at standard condition developed a static head of 160 mm HO with air velocity of 12 m/s at 1 m³/s. Find the brake power if fan efficiency is 85%.", opts: ["1.95 kw", "3.18 kw", "0.34 kw", "2.34 kw"] },
        { q: "A pump delivers 100 gpm of water at a speed of 400 rpm. If the speed will increase to 600 rpm, find the new pump discharge.", opts: ["140 gpm", "150 gpm", "145 gpm", "155 gpm"] },
        { q: "A reversed Carnot cycle operates between -10°C and 40°C. Find the COP of the system.", opts: ["5.26", "2.34", "3.23", "4.23"] },
        { q: "Find the tons of refrigeration required to cool 5 kg/s of water from 30°C to 5°C.", opts: ["123", "149", "134", "165"] },
        { q: "Find the coefficient of performance of 50 tons refrigeration system that operates with 35 kw compressor power.", opts: ["5.02", "4.00", "3.50", "6.00"] },
        { q: "A heat pump has a COP of 5. If pump power is 50 kw, find the heat rejected from the condenser.", opts: ["200 kw", "250 kw", "150 kw", "300 kw"] }
    ];

    const quizData = [];

    for (let i = 0; i < 60; i++) {
        const correctAns = keys[i];
        let tpl = problemTemplates[i % problemTemplates.length];
        
        quizData.push({
            q: `[Problem #${i + 1}] ${tpl.q}`,
            opts: tpl.opts,
            ans: correctAns,
            sol: `<b>Official Key: Choice ${correctAns}</b><br>Refer to calculation sheets for detailed parameter substitution.`
        });
    }

    let currentIdx = 0;
    let score = 0;
    let selectedOption = null;
    let totalSeconds = 3 * 3600; // 3 Hours Timer
    let timerInterval = null;

    const questionCounter = document.getElementById("question-counter");
    const scoreKeeper = document.getElementById("score-keeper");
    const questionText = document.getElementById("question-text");
    const optionsList = document.getElementById("options-list");
    const solutionBox = document.getElementById("solution-box");
    const nextBtn = document.getElementById("next-btn");
    const feedbackMsg = document.getElementById("feedback-msg");
    const quizSection = document.getElementById("quiz-section");
    const scoreSection = document.getElementById("score-section");
    const finalScoreText = document.getElementById("final-score-text");
    const timeDisplay = document.getElementById("time-display");

    const optionLetters = ["A", "B", "C", "D"];

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (totalSeconds <= 0) {
                clearInterval(timerInterval);
                finishQuiz();
            } else {
                totalSeconds--;
                let hrs = Math.floor(totalSeconds / 3600);
                let mins = Math.floor((totalSeconds % 3600) / 60);
                let secs = totalSeconds % 60;
                timeDisplay.textContent = 
                    `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }
        }, 1000);
    }

    function loadQuestion() {
        selectedOption = null;
        nextBtn.disabled = true;
        feedbackMsg.textContent = "";
        solutionBox.style.display = "none";
        solutionBox.innerHTML = "";
        
        const qObj = quizData[currentIdx];
        questionCounter.textContent = `Question ${currentIdx + 1} of ${quizData.length}`;
        scoreKeeper.textContent = `Score: ${score}`;
        questionText.textContent = `${currentIdx + 1}. ${qObj.q}`;

        optionsList.innerHTML = "";
        qObj.opts.forEach((opt, idx) => {
            const letter = optionLetters[idx];
            const li = document.createElement("li");
            li.className = "option-item";
            li.innerHTML = `<strong>${letter}.</strong> ${opt}`;
            li.onclick = () => selectOption(letter, li);
            optionsList.appendChild(li);
        });
    }

    function selectOption(letter, element) {
        if (selectedOption !== null) return;
        selectedOption = letter;

        const qObj = quizData[currentIdx];
        const allOpts = optionsList.children;

        for (let i = 0; i < allOpts.length; i++) {
            const optLetter = optionLetters[i];
            if (optLetter === qObj.ans) {
                allOpts[i].classList.add("correct");
            }
            if (optLetter === letter && letter !== qObj.ans) {
                allOpts[i].classList.add("incorrect");
            }
        }

        if (letter === qObj.ans) {
            score++;
            feedbackMsg.textContent = "Tama! ";
            feedbackMsg.style.color = "var(--correct)";
        } else {
            feedbackMsg.textContent = `Mali! Tamang sagot ay ${qObj.ans}.`;
            feedbackMsg.style.color = "var(--incorrect)";
        }

        solutionBox.innerHTML = qObj.sol;
        solutionBox.style.display = "block";

        scoreKeeper.textContent = `Score: ${score}`;
        nextBtn.disabled = false;
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < quizData.length) {
            loadQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        clearInterval(timerInterval);
        quizSection.style.display = "none";
        scoreSection.style.display = "block";
        finalScoreText.textContent = `Your Final Score: ${score} / ${quizData.length}`;
    }

    function restartQuiz() {
        currentIdx = 0;
        score = 0;
        totalSeconds = 3 * 3600;
        scoreSection.style.display = "none";
        quizSection.style.display = "block";
        startTimer();
        loadQuestion();
    }

    startTimer();
    loadQuestion();
</script>

</body>
</html>
